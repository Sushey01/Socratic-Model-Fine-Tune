[project]
name = "socratic-model-fine-tune"
version = "0.1.0"
description = "Fine-tune Phi-3-mini as a Grade 10 Socratic science tutor"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "accelerate>=1.0.0",
    "bitsandbytes>=0.44.0",
    "datasets>=3.0.0",
    "huggingface_hub>=0.26.0",
    "peft>=0.13.0",
    "torch>=2.4.0",
    "transformers>=4.46.0",
    "trl>=0.12.0",
    "wandb>=0.19.0",
    "python-dotenv>=1.0.0",
    "sentencepiece>=0.2.0",
    "protobuf>=4.0.0",
]

[tool.uv]
package = false
python-preference = "managed"

# PyPI torch on Windows/macOS is CPU-only. uv sync must pull +cu124 or CUDA stays False.
[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.uv.sources]
torch = [
    { index = "pytorch-cu124", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]
